name: CI
"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # dependabot-auto-merge.yml merges with GITHUB_TOKEN, and GitHub does not raise
  # workflow events for pushes made with that token. Auto-merged bumps therefore
  # land on master with no CI run on the resulting tip; this allows re-running it.
  workflow_dispatch:

# Least privilege by default. Nothing in this workflow writes to the repo,
# and the default token grant is write for a push event on a public repo.
permissions:
  contents: read

# Supersede an in-flight run when a branch is pushed again. Cancels nothing
# on master, where every commit should be verified on its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # --only-binary so pip refuses to execute a setup.py during the lint
      # install, matching the --no-build the uv steps use. Quoted because
      # ':all:' would otherwise be read as a YAML mapping.
      - run: "pip install --only-binary :all: ruff==0.16.8"
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    # 3.12 is the floor pyproject declares; 3.14 is what the producer and the
    # Macs run. Testing only 3.12 said nothing about 3.14, where annotations are
    # evaluated lazily (PEP 649) and the MCP SDK builds tool schemas from them.
    # fail-fast off, so a failure on one version still reports the other.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # uv.lock is committed and Dependabot maintains it, but nothing installed
      # from it: `pip install -e .` resolves pyproject's floors afresh on every
      # run, so CI tested a dependency set that was neither the lock nor what
      # production runs, and a Dependabot alert could read "fixed" while the
      # vulnerable version was still being resolved here.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - run: uv sync --frozen --no-build --extra dev
      # -rs lists every skipped test with its reason. A skip in CI is a test that
      # runs NOWHERE, because the developer machine has the tool and never sees
      # the skip; printing them keeps that visible instead of silent.
      - run: uv run --frozen --no-build pytest -q -rs --cov=src --cov=scripts --cov-report=term-missing
  types:
    # mypy ran only in pre-commit, on changed files, with imports followed
    # silently and without the project's dependencies, so it could not see a
    # type the libraries define. The first full run found a live bug: the
    # YouTube fallback indexed a TranscriptList, which only iterates, so no
    # video without an English transcript was ever ingested. Here it runs over
    # everything, inside the locked environment.
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    # Both versions, as in `test`: mypy checks against the interpreter it runs on.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - run: uv sync --frozen --no-build --extra dev
      - run: >-
          uv run --frozen --no-build --with mypy==2.3.1 --with types-requests==2.33.0.20260906
          mypy --ignore-missing-imports --show-error-codes src/ scripts/
  pii-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: PII gauntlet
        # --mode=ci, not the default doctor mode. Doctor mode treats a missing
        # private denylist as a misconfiguration and fails, which is right on a
        # workstation and wrong here, where it exists only if the secret below
        # reaches the job. CI mode runs every generic check and prints an
        # explicit SKIP for the name-based ones when it has no denylist.
        #
        # The name checks ran only in a local pre-commit hook, which never runs
        # for a commit made on GitHub, by Dependabot, or in a clone without the
        # hook. The denylist now comes from the PII_DENYLIST repository secret
        # (the file's text, tab-separated): written to a file mktemp creates
        # 0600 under RUNNER_TEMP, handed to the gauntlet by path, removed on
        # exit. Through env:, never ${{ secrets.* }} in the script, which would
        # paste it into the script text. GitHub withholds secrets from forks and
        # Dependabot, so those runs SKIP the name checks, as every run did before.
        # A hit prints path:line, never the matched text: this log is public.
        env:
          PII_DENYLIST_TEXT: ${{ secrets.PII_DENYLIST }}
        run: |
          if [ -n "$PII_DENYLIST_TEXT" ]; then
            PII_DENYLIST=$(mktemp "$RUNNER_TEMP/pii-denylist.XXXXXX")
            trap 'rm -f "$PII_DENYLIST"' EXIT
            printf '%s\n' "$PII_DENYLIST_TEXT" > "$PII_DENYLIST"
            export PII_DENYLIST
          fi
          unset PII_DENYLIST_TEXT
          bash scripts/pii-gauntlet.sh --mode=ci
  wrappers:
    # Syntax-only gate over the archived scheduler wrappers. Parses each script
    # with the interpreter its shebang names. All of them are bash since the document
    # push (run by /bin/zsh, the only shell holding Full Disk Access on that Mac) was
    # retired on 2026-10-07; the zsh branch stays so one that returns is checked by
    # the shell that runs it, not by bash.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Parse wrappers with their declared interpreter
        run: |
          rc=0
          for f in scripts/wrappers/*/*.sh; do
            shebang=$(head -1 "$f")
            case "$shebang" in
              '#!'*/bash*) checker=bash ;;
              '#!'*/zsh*)  checker=zsh ;;
              *)
                echo "::error file=$f::missing or unrecognised shebang: ${shebang:-<empty>}"
                rc=1
                continue
                ;;
            esac
            if "$checker" -n "$f"; then
              echo "ok    $f ($checker -n)"
            else
              echo "::error file=$f::$checker -n failed"
              rc=1
            fi
          done
          exit $rc
