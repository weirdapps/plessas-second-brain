name: CI
"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # dependabot-auto-merge.yml merges with GITHUB_TOKEN, and GitHub does not raise
  # workflow events for pushes made with that token. Auto-merged bumps therefore
  # land on master with no CI run on the resulting tip; this allows re-running it.
  workflow_dispatch:

# Least privilege by default. Nothing in this workflow writes to the repo,
# and the default token grant is write for a push event on a public repo.
permissions:
  contents: read

# Supersede an in-flight run when a branch is pushed again. Cancels nothing
# on master, where every commit should be verified on its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install ruff==0.15.13  # pinned: unpinned ruff drifts (markdown-format) and breaks lint
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # uv.lock is committed and Dependabot maintains it, but nothing installed
      # from it: `pip install -e .` resolves pyproject's floors afresh on every
      # run, so CI tested a dependency set that was neither the lock nor what
      # production runs, and a Dependabot alert could read "fixed" while the
      # vulnerable version was still being resolved here.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # zsh is a real test dependency: 8 of the 15 document-sync wrapper tests
      # skip without it, and the wrapper is run by /bin/zsh in production. The
      # `wrappers` job below already installs zsh for exactly this reason.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      # -rs lists every skipped test with its reason. A skip in CI is a test that
      # runs NOWHERE, because the developer machine has the tool and never sees
      # the skip; printing them keeps that visible instead of silent.
      - run: uv run --frozen pytest -q -rs --cov=src --cov=scripts --cov-report=term-missing
  pii-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: PII gauntlet
        # --mode=ci, not the default doctor mode. Doctor mode treats a missing
        # private denylist as a misconfiguration and fails, which is right on a
        # workstation and wrong here: the denylist lives in a private repo and
        # can never exist on a public runner. CI mode still runs every generic
        # org-tell check and prints an explicit SKIP for the name-based ones, so
        # this narrows nothing that CI was ever able to evaluate.
        run: bash scripts/pii-gauntlet.sh --mode=ci
  wrappers:
    # Syntax-only gate over the archived scheduler wrappers. Parses each script
    # with the interpreter its shebang names — sync-documents-to-vps.sh is run by
    # /bin/zsh in production (the only shell holding Full Disk Access on that
    # Mac), so checking it with bash would validate a shell that never runs it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Parse wrappers with their declared interpreter
        run: |
          rc=0
          for f in scripts/wrappers/*/*.sh; do
            shebang=$(head -1 "$f")
            case "$shebang" in
              '#!'*/bash*) checker=bash ;;
              '#!'*/zsh*)  checker=zsh ;;
              *)
                echo "::error file=$f::missing or unrecognised shebang: ${shebang:-<empty>}"
                rc=1
                continue
                ;;
            esac
            if "$checker" -n "$f"; then
              echo "ok    $f ($checker -n)"
            else
              echo "::error file=$f::$checker -n failed"
              rc=1
            fi
          done
          exit $rc
