[project]
name = "second-brain"
version = "0.1.0"
description = "Email second brain: extract, structure, and query institutional memory from Outlook, attachments, calendar, Teams, and Claude Code conversations"
requires-python = ">=3.12"
dependencies = [
    # What src/store/embeddings.py actually imports is `from google import genai`.
    # This used to declare google-cloud-aiplatform, which imports nowhere in this
    # repo and was only ever supplying google-genai by transitive accident.
    "google-genai>=1.66.0",
    # 0.120.2 is the first release whose mcp extra allows mcp SDK v2 (0.120.1 pinned <2).
    # 1.x moved the HTTP layer from httpx to httpx2 and raised the Python floor to
    # 3.10; nothing here was affected (no .with_raw_response, no Text Completions, no
    # temperature/top_p/top_k, and src/extract/web_ingest.py's httpx use never crosses
    # the SDK boundary). Floor raised so a fresh resolve cannot land back on 0.x.
    "anthropic[vertex]>=1.7.0",
    "numpy>=2.5.2",
    # v2 removed mcp.server.fastmcp; the server uses mcp.server.MCPServer.
    "mcp[cli]>=2.0.0",
    "youtube-transcript-api>=1.2.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    # Excel binary format (.xlsb), read-only
    "pyxlsb>=1.0.10",
    # Legacy Excel (.xls); xlrd 2.0+ dropped .xlsx support, focuses exclusively on .xls
    "xlrd>=2.0.1",
    "pillow-heif>=1.5.0",
    # Security pin. Not needed by anything here directly: anyio arrives transitively
    # via anthropic and mcp, and uv.lock has held a fixed version since #70 bumped it
    # to 4.14.2. It is declared anyway because the VPS deploy hook is
    # `pip install -e .` with no --upgrade, which resolves THESE specifiers and never
    # reads uv.lock. Measured 2026-09-20: #70 merged green, the lock said 4.14.2, and
    # ~/.venvs/second-brain was still running 4.13.0 - the exact version the PR was
    # raised to get off. Declaring it is what makes the fix ship.
    "anyio>=4.14.2",  # CVE-2026-63374 CRITICAL + CVE-2026-64847; fixed in 4.14.2
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
]

[project.scripts]
# Use python -m src.cli instead
# brain = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "E722", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
