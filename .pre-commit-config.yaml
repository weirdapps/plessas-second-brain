# Pre-commit hooks for Python projects
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags in GitHub Actions
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Ruff - replaces black, isort, flake8
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # MyPy - type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # --follow-imports=silent: type-check the changed file(s), but don't
        # report errors found in transitively-imported modules. Pre-commit
        # runs the mypy hook on the changed files only, so if mypy follows
        # imports into other modules we get a flood of pre-existing errors
        # unrelated to the current commit (e.g. implicit-Optional debt in
        # src/extract/attachment_pipeline.py). For full project-wide type
        # audits, run `mypy src/` directly outside the hook.
        args: [--ignore-missing-imports, --show-error-codes, --follow-imports=silent]
        additional_dependencies: [types-requests]

  # Gitleaks - secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # YAML linting for GitHub Actions
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict, -d, '{extends: default, rules: {line-length: {max: 120}, document-start: disable}}']
        files: \.github/workflows/.*\.ya?ml$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]

  # PII gauntlet - block personal data from entering tracked files
  - repo: local
    hooks:
      - id: pii-gauntlet
        name: pii-gauntlet
        entry: scripts/pii-gauntlet.sh
        language: script
        pass_filenames: false
        always_run: true
