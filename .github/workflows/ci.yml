name: CI
"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # dependabot-auto-merge.yml merges with GITHUB_TOKEN, and GitHub does not raise
  # workflow events for pushes made with that token. Auto-merged bumps therefore
  # land on master with no CI run on the resulting tip; this allows re-running it.
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install ruff==0.15.13  # pinned: unpinned ruff drifts (markdown-format) and breaks lint
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest
  pii-gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: PII gauntlet
        run: bash scripts/pii-gauntlet.sh
