# sb-outlook-sync mail backend: auto (plan phase B1, plessas-second-brain #301).
# The Graph CLI answers list-mail, get-mail and attachment downloads; any failure
# falls back to outlook-cli for that call, and every call leaves one ok or fallback
# line in data/mail_backend_events.jsonl. Gate to Retire: 7 days, fallback rate
# under 1%, no page:   ./brain mail-backend-report --since <flip time>
#
# The binary's path is host-local and stays out of this public repo: it lives in a
# separate drop-in, graph-cli.conf, beside this one ([Service] then
# Environment=GRAPH_CLI_PATH=<absolute path>). Today the live mail-backend.conf
# carries that line; move it to graph-cli.conf before replacing the file.
#
# NOT deployed by scripts/deploy.sh (it installs ~/.local/bin wrappers, no units).
# Flip by hand on the VPS, only when the estate row vps:shadow:mail-backend reads
# ready (14 clean days, both verbs, zero non-matches) and the attachment parity test
# reports problem=0, with sb-outlook-sync.service inactive:
#   cp scripts/wrappers/systemd/sb-outlook-sync.service.d/mail-backend.conf \
#      ~/.config/systemd/user/sb-outlook-sync.service.d/mail-backend.conf
#   systemctl --user daemon-reload
#   systemctl --user show sb-outlook-sync.service -p Environment
# Back to shadow: SB_MAIL_BACKEND=shadow here, daemon-reload. Back to plain
# outlook-cli: delete both drop-ins, daemon-reload.
# After the flip, retire the estate row (it goes STALE by design, no shadow lines).
[Service]
Environment=SB_MAIL_BACKEND=auto
